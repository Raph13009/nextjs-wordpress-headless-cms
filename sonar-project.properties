# SonarQube / SonarCloud Configuration
# Disable quality gate checks for now

sonar.qualitygate.wait=false
sonar.qualitygate.skip=true

# Disable duplicate code detection
sonar.cpd.exclusions=**/*

# Disable security hotspot review requirement
sonar.security.hotspots.reviewed=false

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**

